<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOAT カタログ</title><style> *{box-sizing:border-box}body{margin:0;background:#f4f6f4;color:#23372e;font:16px system-ui}header{background:#214b3b;color:white;padding:22px}main{max-width:1050px;margin:auto;padding:16px}button,input,select,textarea{font:inherit;padding:10px;border:1px solid #bbc9c0;border-radius:8px}button{background:#fff;cursor:pointer}button.active,button.primary{background:#28644c;color:white}nav,.bar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}section,article{background:white;border:1px solid #dce5dc;border-radius:12px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}label{display:block;margin:8px 0}label input, label textarea, label select{display:block;width:100%}input[type=checkbox]{width:auto;display:inline}img,.placeholder{width:100px;height:100px;object-fit:contain;background:#edf1ed;border-radius:8px}.game{display:flex;gap:12px}h2,h3{margin:0 0 8px}small{color:#65776a}textarea{min-height:75px}dialog{width:min(650px,95vw);max-height:90vh;overflow:auto;border:1px solid #aaa;border-radius:12px}#genres label{display:inline-block;margin:5px} </style><header><h2>GOAT BOARD GAME</h2>ボードゲームカタログ · 試作版</header><main><nav id="nav"></nav><small>端末内保存のデモです。権限分離・端末間共有は未実装です。</small><section><div class="bar"><input id="q" placeholder="ゲーム名・種類で検索"><input id="people" type="number" min="1" placeholder="人数" style="width:100px"><input id="time" type="number" min="1" placeholder="分以内" style="width:110px"><select id="level"><option value="">難易度指定なし</option><option value="1">すぐ遊べる</option><option value="2">かんたん以下</option><option value="3">普通以下</option><option value="4">難しい以下</option><option value="5">すべて</option></select><select id="genre"></select><select id="sort"><option value="name">五十音順</option><option value="difficulty">難易度順</option></select></div><div id="tools" class="bar"></div><div id="count"></div></section><div id="cards" class="grid"></div></main><dialog id="editor"><form id="form"><h2>ゲーム情報</h2><div id="fields"></div><label>種類（複数選択）</label><div id="genres"></div><label>写真<input id="photo" type="file" accept="image/*"></label><div id="photoPreview"></div><div class="bar"><button class="primary" type="submit">保存</button><button type="button" onclick="editor.close()">キャンセル</button></div></form></dialog><input type="file" id="csvfile" accept=".csv,.txt" hidden><script>
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const defaults=['協力｜みんなで協力','対戦｜勝負する','人狼・正体隠匿｜正体を見破る','推理｜謎を解く','パーティー｜盛り上がる','アクション｜手を使う','記憶｜覚える','パズル｜組み合わせる','戦略｜じっくり考える','カード','ダイス','その他'];let master=JSON.parse(localStorage.getItem('goatGenres')||'null')||defaults;let games=JSON.parse(localStorage.getItem('goatGames')||'null')||['犯人は踊る','音速飯店','タイムボム','ゴブレットゴブラーズ'].map((name,i)=>({id:'demo'+i,name,desc:'試作用の仮データです。',genres:[],published:true}));let mode='customer', selected=new Set(), editing=null, pic='', missing=false;const spec=[['name','ゲーム名'],['reading','読み仮名'],['difficulty','難易度（1〜5）','number'],['min','最少人数','number'],['max','最大人数','number'],['tmin','最少時間（分）','number'],['tmax','最大時間（分）','number'],['desc','簡易説明','textarea'],['best','おすすめ人数'],['age','対象年齢'],['shelf','棚番号'],['memo','スタッフメモ','textarea'],['source','参照元URL']];let keys=['name','reading','difficulty','genres','min','max','tmin','tmax','desc','best','age','shelf','memo','source'];let headers=['ゲーム名','読み仮名','難易度','ジャンル','最少人数','最大人数','最少時間','最大時間','簡易説明','おすすめ人数','対象年齢','棚番号','スタッフメモ','参照元URL'];function save(){try{localStorage.setItem('goatGames',JSON.stringify(games));localStorage.setItem('goatGenres',JSON.stringify(master));}catch(e){alert('保存容量を超えました。CSVを出力して保全してください。');}render()}function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)).replace(/[\s・ー\-]/g,'')}function similar(a,b){a=norm(a);b=norm(b);if(!a||!b)return false;if(a===b||a.includes(b)||b.includes(a))return true;let d=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let p=d[0];d[0]=i;for(let j=1;j<=b.length;j++){let t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,p+(a[i-1]!==b[j-1]));p=t}}return Math.min(a.length,b.length)>=4&&d[b.length]<=1}function range(a,b,s){return a?`${a}${b&&b!=a?'〜'+b:''}${s}`:'未登録'}function filtered(){let q=norm($('q').value),p=+$('people').value,t=+$('time').value,l=+$('level').value,g=$('genre').value;return games.filter(x=>(mode!=='customer'||x.published!==false)&&(!q||norm([x.name,x.reading,x.desc,...(x.genres||[])].join(' ')).includes(q))&&(!p||(+x.min<=p&&+x.max>=p))&&(!t||(+x.tmax>0&&+x.tmax<=t))&&(!l||(+x.difficulty>0&&+x.difficulty<=l))&&(!g||(x.genres||[]).includes(g))&&(!missing||!x.photo||!x.desc||!x.min||!x.max||!x.tmin||!x.tmax||!x.difficulty||!x.genres?.length)).sort((a,b)=>$('sort').value==='difficulty'?(+a.difficulty||99)-(+b.difficulty||99):String(a.reading||a.name).localeCompare(b.reading||b.name,'ja'))}function render(){let g=$('genre').value;$('genre').innerHTML='<option value="">種類指定なし</option>'+master.map(v=>`<option>${esc(v)}</option>`).join('');$('genre').value=g;$('nav').innerHTML=[['customer','お客様'],['staff','スタッフ'],['admin','商品管理']].map(([v,n])=>`<button class="${mode===v?'active':''}" onclick="mode='${v}';missing=false;selected.clear();render()">${n}</button>`).join('');$('tools').innerHTML=mode==='customer'?'':`<button onclick="word(filtered())">検索結果をWord出力</button><button onclick="word(games.filter(g=>selected.has(g.id)))">選択分をWord出力</button><button onclick="word(games)">全件Word出力</button>`+(mode==='admin'?`<button class="primary" onclick="edit()">＋新規登録</button><button onclick="csvfile.click()">CSV取込</button><button onclick="csv()">CSV出力</button><button onclick="missing=!missing;render()">${missing?'全件表示':'未完成のみ'}</button><button onclick="manage()">種類設定</button>`:'');let list=filtered();$('count').textContent=list.length+' 件';$('cards').innerHTML=list.map(x=>`<article><div class="game">${x.photo?`<img src="${esc(x.photo)}">`:'<div class="placeholder">写真未登録</div>'}<div><h3>${esc(x.name)}</h3><small>${range(x.min,x.max,'人')} · ${range(x.tmin,x.tmax,'分')} · 難易度 ${esc(x.difficulty||'未登録')}</small><p>${esc(x.desc)}</p><small>${esc((x.genres||[]).join(' / '))}</small></div></div>${mode==='customer'?'':`<p>棚：${esc(x.shelf||'未登録')}　${esc(x.memo||'')}</p><label><input type="checkbox" ${selected.has(x.id)?'checked':''} onchange="this.checked?selected.add('${x.id}'):selected.delete('${x.id}')"> 出力対象</label>`}${mode==='admin'?`<button onclick="edit('${x.id}')">編集</button> <button onclick="del('${x.id}')">削除</button> ${x.published===false?'非公開':''}`:''}</article>`).join('')}function edit(id){editing=games.find(x=>x.id===id)||null;pic=editing?.photo||'';$('fields').innerHTML=spec.map(([k,n,t])=>`<label>${n}${t==='textarea'?`<textarea name="${k}">${esc(editing?.[k])}</textarea>`:`<input name="${k}" type="${t||'text'}" value="${esc(editing?.[k])}" ${k==='name'?'required':''} ${t==='number'?'min="1"':''} ${k==='difficulty'?'max="5"':''}>`}</label>`).join('')+`<label><input type="checkbox" name="published" ${editing?.published!==false?'checked':''}> お客様に公開</label>`;$('genres').innerHTML=master.map(v=>`<label><input type="checkbox" name="genre" value="${esc(v)}" ${editing?.genres?.includes(v)?'checked':''}>${esc(v)}</label>`).join('');$('photo').value='';preview();$('editor').showModal()}function preview(){$('photoPreview').innerHTML=pic?`<img src="${esc(pic)}"> <button type="button" onclick="pic='';preview()">写真削除</button>`:''}$('photo').onchange=async()=>{let f=$('photo').files[0];if(!f)return;try{let im=await createImageBitmap(f),c=document.createElement('canvas'),s=Math.min(1,800/Math.max(im.width,im.height));c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pic=c.toDataURL('image/jpeg',.76);preview()}catch(e){alert('画像を読み込めません')}};$('form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),x=Object.fromEntries(spec.map(([k])=>[k,String(f.get(k)||'').trim()]));if(+x.min>+x.max&&x.max||+x.tmin>+x.tmax&&x.tmax)return alert('最小・最大を確認してください');let dup=games.find(g=>g.id!==editing?.id&&similar(g.name,x.name));if(dup&&!confirm('重複候補：'+dup.name+'。別商品として保存しますか？'))return;x.genres=f.getAll('genre');x.photo=pic;x.published=f.has('published');x.id=editing?.id||crypto.randomUUID();if(editing)games=games.map(g=>g.id===x.id?x:g);else games.push(x);$('editor').close();save()};function del(id){if(confirm('削除しますか？')){games=games.filter(x=>x.id!==id);save()}}function manage(){let v=prompt('種類を1行ずつ入力（既存の名称変更は登録済みゲームに反映されません）',master.join('\n'));if(v!==null){master=[...new Set(v.split('\n').map(x=>x.trim()).filter(Boolean))];save()}}function download(blob,name){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),3000)}function csv(){let quote=v=>'"'+String(v??'').replaceAll('"','""')+'"';download(new Blob(['\ufeff'+[headers,...games.map(x=>keys.map(k=>k==='genres'?(x[k]||[]).join('|'):x[k]))].map(r=>r.map(quote).join(',')).join('\r\n')],{type:'text/csv'}),'goat.csv')}function parse(s){let rows=[],r=[],v='',quoted=false;for(let i=0;i<s.length;i++){let c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){v+='"';i++}else quoted=!quoted}else if(!quoted&&c===','){r.push(v);v=''}else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&s[i+1]==='\n')i++;r.push(v);rows.push(r);r=[];v=''}else v+=c}if(v||r.length){r.push(v);rows.push(r)}return rows} $('csvfile').onchange=async()=>{let f=$('csvfile').files[0];if(!f)return;let rows=parse((await f.text()).replace(/^\ufeff/,'')),h=rows.shift(),n=0;if(!h.includes('ゲーム名')){alert('CSVの先頭行にゲーム名が必要です');return}for(let r of rows){let x=Object.fromEntries(keys.map((k,i)=>[k,r[h.indexOf(headers[i])]||'']));if(!x.name.trim())continue;x.genres=x.genres.split('|').filter(Boolean);let dup=games.find(g=>similar(g.name,x.name));if(dup){let a=prompt('重複候補：'+dup.name+' / '+x.name+'\n1: スキップ 2: 更新 3: 別商品','1');if(a==='2'){Object.assign(dup,Object.fromEntries(Object.entries(x).filter(([k,v])=>v.length)));n++;continue}if(a!=='3')continue}x.id=crypto.randomUUID();x.published=false;games.push(x);n++}save();alert(n+'件処理しました。新規取込は非公開です。');$('csvfile').value=''};for(let id of ['q','people','time','level','genre','sort'])$(id).oninput=render;
async function word(list){if(!list.length)return alert('対象がありません');try{const D=await import('https://cdn.jsdelivr.net/npm/docx@9.5.1/+esm');let children=[];const p=(text,size=22,bold=false)=>new D.Paragraph({children:[new D.TextRun({text:String(text||''),size,bold,font:'Yu Gothic'})],spacing:{after:80}});for(let i=0;i<list.length;i+=4){if(i)children.push(new D.Paragraph({children:[new D.PageBreak()]}));children.push(p('GOAT BOARD GAME CATALOG',30,true));let rows=list.slice(i,i+4).map(x=>{let image=x.photo?new D.Paragraph({children:[new D.ImageRun({type:'jpg',data:Uint8Array.from(atob(x.photo.split(',')[1]),c=>c.charCodeAt(0)),transformation:{width:112,height:112}})]}):p('写真未登録');return new D.TableRow({cantSplit:true,height:{value:3150,rule:D.HeightRule.ATLEAST},children:[new D.TableCell({width:{size:25,type:D.WidthType.PERCENTAGE},children:[image]}),new D.TableCell({width:{size:75,type:D.WidthType.PERCENTAGE},children:[p(x.name,28,true),p(`${range(x.min,x.max,'人')} / ${range(x.tmin,x.tmax,'分')} / 難易度 ${x.difficulty||'未登録'}`),p((x.genres||[]).join(' / '),19),p(x.desc)]})]})});children.push(new D.Table({width:{size:100,type:D.WidthType.PERCENTAGE},rows}))}let doc=new D.Document({sections:[{properties:{page:{size:{width:11906,height:16838},margin:{top:850,bottom:850,left:850,right:850}}},children}]});download(await D.Packer.toBlob(doc),'GOAT_catalog.docx')}catch(e){alert('Word出力に失敗しました。インターネット接続を確認してください。 '+e.message)}}render();</script></html>
